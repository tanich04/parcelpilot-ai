# render.yaml
services:
  - type: web
    name: parcelpilot-api
    env: python
    buildCommand: |
      pip install -r requirements.txt

      mkdir -p data/pdfs data/excel
    
      echo "Creating database..."
    
      python src/ingestion/init_db.py
    
      echo "Loading data..."
    
      python -m src.ingestion.data_loader
      
      echo "Build complete!"      
    startCommand: uvicorn src.api.endpoints:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
