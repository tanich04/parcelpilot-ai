services:
  - type: web
    name: parcelpilot-api
    env: python
    buildCommand: |
      pip install -r requirements.txt
      
      echo "📥 Downloading data..."
      mkdir -p data/pdfs data/excel
      
      # Download Excel
      wget --no-check-certificate 'https://drive.google.com/uc?export=download&id=1F_HPGQIwdfi6U9hr8E4UiodklVdXLiBW' -O data/excel/ParcelPilot_Assessment_Data.xlsx
      
      # Download PDFs
      wget --no-check-certificate 'https://drive.google.com/uc?export=download&id=1X-fpuMsb3hwx5hsK3pwgoqb4m4nxCOJH' -O data/pdfs/01_Support_Policy_v3_CURRENT.pdf
      wget --no-check-certificate 'https://drive.google.com/uc?export=download&id=1u5gTNIqqcbFYwl_fOkl9dfuAaLHcNoYp' -O data/pdfs/02_Support_Policy_v2_DEPRECATED.pdf
      wget --no-check-certificate 'https://drive.google.com/uc?export=download&id=14Abbmi-ji98KhlWrDLBkdl6c6-ggNEXR' -O data/pdfs/03_Cancellation_and_Service_Credit_SOP_v4.pdf
      wget --no-check-certificate 'https://drive.google.com/uc?export=download&id=1I9ofIn9gqOlHzpmWncl6mJ4YQuTX0HPx' -O data/pdfs/04_Product_Operations_Guide_and_Known_Issues.pdf
      wget --no-check-certificate 'https://drive.google.com/uc?export=download&id=1sC_cN29oCEHvmAELgMRdn91njIMFU17e' -O data/pdfs/05_Northstar_Logistics_Enterprise_Agreement.pdf
      wget --no-check-certificate 'https://drive.google.com/uc?export=download&id=1j_O-As-w6biUXSXlefpka4SjvSoqhoV7' -O data/pdfs/06_LumenWorks_Service_Agreement.pdf
      
      echo "✅ Data downloaded!"
      
      # ✅ CREATE TABLES FIRST
      echo "📊 Creating database tables..."
      python -c "
import sqlite3
conn = sqlite3.connect('/opt/render/project/src/parcelpilot.db')
conn.execute('CREATE TABLE IF NOT EXISTS accounts (account_id TEXT PRIMARY KEY, account_name TEXT, plan TEXT, status TEXT, csm TEXT, contract_file TEXT, premium_support TEXT, notes TEXT)')
conn.execute('CREATE TABLE IF NOT EXISTS orders (order_id TEXT PRIMARY KEY, account_id TEXT, carrier TEXT, status TEXT, booked_at TIMESTAMP, pickup_window_start TIMESTAMP, pickup_window_end TIMESTAMP, pickup_actual_at TIMESTAMP, shipment_fee_inr REAL, carrier_fault INTEGER, customer_fault INTEGER, cancellation_requested_at TIMESTAMP, notes TEXT)')
conn.execute('CREATE TABLE IF NOT EXISTS tickets (ticket_id TEXT PRIMARY KEY, account_id TEXT, created_at TIMESTAMP, status TEXT, subject TEXT, description TEXT, channel TEXT, assigned_to TEXT, last_customer_message_at TIMESTAMP, historical_resolution TEXT)')
conn.execute('CREATE TABLE IF NOT EXISTS documents (doc_id INTEGER PRIMARY KEY AUTOINCREMENT, filename TEXT, doc_type TEXT, authority_level INTEGER, account_scope TEXT, is_current INTEGER, content TEXT, metadata TEXT)')
conn.commit()
conn.close()
print('✅ Tables created!')
"
      
      # ✅ LOAD DATA
      echo "📊 Loading data..."
      python -c "from src.ingestion.data_loader import DataLoader; DataLoader().load_excel('data/excel/ParcelPilot_Assessment_Data.xlsx'); DataLoader().load_pdfs('data/pdfs')"
      
    startCommand: uvicorn src.api.endpoints:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: DB_PATH
        value: /opt/render/project/src/parcelpilot.db
      - key: CHROMA_PATH
        value: /opt/render/project/src/chroma_db
